server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API lives behind the same origin as the SPA. That is deliberate: `src/api.js` calls the
    # relative path `/api`, so there is no cross-origin request to authorise and no CORS
    # preflight on any call. In development the same shape is produced by the Vite proxy.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS, so the scheme the browser used is only knowable from this
        # header. Passing the literal $scheme would tell the backend "http" for an https visit.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # An export of many notes is built as a zip in memory before the first byte is sent, and
        # the worker's Telegram calls can hold a request while Bot API is slow. 60s is the
        # default and is too tight for the former on a cold cache.
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    # React Router owns the URL space: /notes, /calendar, /settings and /s/<token> exist only in
    # the bundle. Without this fallback, opening a shared link directly — which is the entire
    # point of a shared link — would return nginx's 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a stale copy can never shadow a new deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html carries no fingerprint and points at everything that does. Cached, it would keep
    # serving the previous deploy's asset names after an update.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
